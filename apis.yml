aid: usereframe
name: Reframe
description: 'Reframe (usereframe.ai) is a San Francisco-based Y Combinator Winter
  2026 company, founded in 2025 by Bryan Zin (previously a Product Design Engineer
  on the iPhone team at Apple) and Eric Wiener, building an AI-native hardware procurement
  platform. Reframe automates the manual procurement process in hardware supply chains:
  instead of emails and spreadsheets, AI agents handle purchase orders, supplier
  follow-ups, and part tracking for both COTS and custom-manufactured components,
  with Slack and Gmail integrations for team workflows. This API Evangelist profile
  tracks Reframe as a company in the network; the company does not currently publish
  a public developer API.'
